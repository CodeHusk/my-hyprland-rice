# ===================================================================
# HYPRLOCK - GRAPHITE / BRONZE EDITION
# ThinkPad T470 Friendly
# ===================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

# ===================================================================
# WALLPAPER
# ===================================================================

background {
    monitor =
    path = /home/rudransh/Pictures/miyamoto-musashi-3840x2160-15204.jpg

    blur_passes = 0
    blur_size = 0

    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ===================================================================
# ANIMATIONS
# ===================================================================

animations {
    enabled = true

    bezier = smooth, 0.25, 0.1, 0.25, 1

    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
}

# ===================================================================
# CLOCK
# ===================================================================

label {
    monitor =

    text = $TIME12

    color = rgba(245,245,245,0.98)

    font_size = 96
    font_family = JetBrainsMono Nerd Font
    font_weight = bold

    halign = center
    valign = top

    position = 0, -180

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0,0,0,0.35)
}

# ===================================================================
# DATE
# ===================================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"

    color = rgba(196,154,108,0.90)

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = top

    position = 0, -115
}

# ===================================================================
# PASSWORD PANEL
# ===================================================================

shape {
    monitor =

    size = 420, 130

    color = rgba(15,15,15,0.72)

    border_size = 2
    border_color = rgba(196,154,108,0.75)

    rounding = 24

    halign = center
    valign = center

    position = 0, -70

    blur_passes = 0

    shadow_passes = 1
    shadow_size = 12
    shadow_color = rgba(0,0,0,0.45)
}

# ===================================================================
# PASSWORD INPUT
# ===================================================================

input-field {
    monitor =

    size = 340, 58

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    hide_input = true

    outer_color = rgba(196,154,108,0.75)
    inner_color = rgba(0,0,0,0)

    font_color = rgba(255,255,255,1.0)

    check_color = rgba(196,154,108,1.0)
    fail_color = rgba(220,120,120,1.0)

    font_family = JetBrainsMono Nerd Font
    font_size = 18

    halign = center
    valign = center

    position = 0, -70

    placeholder_text = Password
    fail_text = Incorrect Password

    rounding = 18
}

# ===================================================================
# USERNAME
# ===================================================================

label {
    monitor =

    text = $USER

    color = rgba(200,200,200,0.75)

    font_size = 16
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = center

    position = 0, 20
}
